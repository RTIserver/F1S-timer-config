<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1S Timer - Test konfig</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --border: #d8d6cf;
    --text: #26251f;
    --muted: #6b6a62;
    --accent: #185fa5;
    --accent-dark: #0c447c;
    --ok: #3b6d11;
    --err: #a32d2d;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-bottom: 16px;
  }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.connected { background: var(--ok); }
  .dot.error { background: var(--err); }
  button {
    padding: 13px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 500; cursor: pointer;
  }
  button:active { background: var(--accent-dark); }
  button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .full-btn { width: 100%; }
  input[type="text"] {
    width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 16px; background: #fff; color: var(--text);
  }
  .pin-row { display: flex; gap: 8px; margin-top: 10px; }
  .pin-row input { flex: 1; letter-spacing: 4px; text-align: center; }
  .pin-row button { width: auto; padding: 11px 18px; flex-shrink: 0; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .hidden { display: none !important; }
  .ios-note {
    background: #fdf5e8; border: 1px solid #edd9ad; border-radius: var(--radius);
    padding: 12px 14px; font-size: 13px; color: #6b5111; margin-bottom: 16px;
  }

  .param-row {
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .param-row:last-child { border-bottom: none; }
  .param-label {
    font-weight: 500; font-size: 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .param-value {
    font-variant-numeric: tabular-nums;
    font-size: 15px; color: var(--accent); font-weight: 600;
  }
  .param-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .param-buttons button {
    padding: 10px 0;
    font-size: 15px;
    font-weight: 600;
  }
  .param-buttons button.big { background: var(--accent-dark); }
  .param-status { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>F1S timer - test konfig</h1>
  <p class="sub">Simpel testside til alle indstillinger over Bluetooth Low Energy</p>
  <p class="sub" style="color:#a32d2d; font-weight:600;">Version: v17-register-protokol</p>

  <div id="iosNote" class="ios-note hidden">
    Safari understøtter ikke Bluetooth. Åbn denne side i <strong>Bluefy</strong> (gratis app fra App Store) for at forbinde.
  </div>

  <div class="card">
    <div class="status-line">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Ikke forbundet</span>
    </div>
    <button class="full-btn" id="connectBtn">Forbind til timer</button>
  </div>

  <div id="authCard" class="card hidden">
    <div class="label" style="font-weight:500; margin-bottom:4px;">Adgangskode</div>
    <div class="pin-row">
      <input type="text" id="pinInput" inputmode="numeric" maxlength="6" placeholder="Kode">
      <button id="unlockBtn">Lås op</button>
    </div>
    <div id="authMsg" class="msg"></div>
  </div>

  <div id="configCard" class="card hidden">
    <div id="paramList"></div>
    <div id="loadMsg" class="msg"></div>
  </div>
</div>

<script>
const SERVICE_UUID        = "12345678-1234-5678-1234-56789abcdef0";
const CHAR_AUTH_UUID      = "12345678-1234-5678-1234-56789abcdef1";
const CHAR_AUTH_STAT_UUID = "12345678-1234-5678-1234-56789abcdef2";
const CHAR_SELECT_UUID    = "12345678-1234-5678-1234-56789abcdef9";
const CHAR_VALUE_LO_UUID  = "12345678-1234-5678-1234-56789abcdefa";
const CHAR_VALUE_HI_UUID  = "12345678-1234-5678-1234-56789abcdefb";
const CHAR_ADJUST_UUID    = "12345678-1234-5678-1234-56789abcdefc";

// Skal matche raekkefoelgen af parametre i firmwaren praecist
const PARAMS = [
  { label: "Idle power",     unit: "µs" },
  { label: "Climb power",    unit: "µs" },
  { label: "Motor run-time", unit: "ms" },
  { label: "Fade-tid",       unit: "ms" },
  { label: "DT-tid",         unit: "sek" },
  { label: "Servo start-pos",unit: "µs" },
  { label: "Servo DT-pos",   unit: "µs" },
];

let device, server;
let authChar, authStatChar, selectChar, valueLoChar, valueHiChar, adjustChar;
const enc = new TextEncoder();
const dec = new TextDecoder();

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const connectBtn = document.getElementById('connectBtn');
const authCard = document.getElementById('authCard');
const configCard = document.getElementById('configCard');
const authMsg = document.getElementById('authMsg');
const loadMsg = document.getElementById('loadMsg');
const paramList = document.getElementById('paramList');

if (/iP(hone|ad|od)/.test(navigator.userAgent) && !navigator.bluetooth) {
  document.getElementById('iosNote').classList.remove('hidden');
}
if (!navigator.bluetooth) {
  connectBtn.disabled = true;
  connectBtn.textContent = "Bluetooth ikke tilgængelig i denne browser";
}

function setStatus(text, cls) {
  statusText.textContent = text;
  statusDot.className = 'dot' + (cls ? ' ' + cls : '');
}

// Bygger param-rækkerne i HTML én gang
PARAMS.forEach((p, i) => {
  const row = document.createElement('div');
  row.className = 'param-row';
  row.innerHTML = `
    <div class="param-label">
      <span>${p.label}</span>
      <span class="param-value" id="val-${i}">-</span>
    </div>
    <div class="param-buttons">
      <button data-idx="${i}" data-code="2" class="big">--</button>
      <button data-idx="${i}" data-code="0">-</button>
      <button data-idx="${i}" data-code="1">+</button>
      <button data-idx="${i}" data-code="3" class="big">++</button>
    </div>
    <div class="param-status" id="stat-${i}"></div>
  `;
  paramList.appendChild(row);
});

paramList.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-idx]');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const code = parseInt(btn.dataset.code, 10);
  await adjustParam(idx, code);
});

connectBtn.addEventListener('click', async () => {
  try {
    setStatus('Søger...', '');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);

    server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    authChar = await service.getCharacteristic(CHAR_AUTH_UUID);
    authStatChar = await service.getCharacteristic(CHAR_AUTH_STAT_UUID);
    selectChar = await service.getCharacteristic(CHAR_SELECT_UUID);
    valueLoChar = await service.getCharacteristic(CHAR_VALUE_LO_UUID);
    valueHiChar = await service.getCharacteristic(CHAR_VALUE_HI_UUID);
    adjustChar = await service.getCharacteristic(CHAR_ADJUST_UUID);

    setStatus('Forbundet - lås op med kode', 'connected');
    authCard.classList.remove('hidden');
    connectBtn.textContent = "Forbundet";
    connectBtn.disabled = true;
  } catch (err) {
    setStatus('Kunne ikke forbinde', 'error');
    console.error(err);
  }
});

function onDisconnected() {
  setStatus('Forbindelse afbrudt', 'error');
  authCard.classList.add('hidden');
  configCard.classList.add('hidden');
  connectBtn.textContent = "Forbind til timer";
  connectBtn.disabled = false;
}

let authHandled = false;

document.getElementById('unlockBtn').addEventListener('click', async () => {
  const pin = document.getElementById('pinInput').value.trim();
  if (!pin) return;
  authHandled = false;
  authMsg.textContent = 'Tjekker...';
  authMsg.className = 'msg';

  try {
    await authChar.writeValue(enc.encode(pin));
  } catch (err) {
    authMsg.textContent = 'Fejl ved skrivning: ' + err.message;
    authMsg.className = 'msg err';
    console.error(err);
    return;
  }

  let lastError = null;
  let lastRawValue = null;
  for (let i = 0; i < 10 && !authHandled; i++) {
    await new Promise(r => setTimeout(r, 300));
    try {
      const val = await authStatChar.readValue();
      const result = dec.decode(val).trim().replace(/\0/g, '');
      lastRawValue = result;
      authMsg.textContent = 'Tjekker... (' + i + ': "' + result + '")';
      if (result === 'U' || result === 'D') {
        handleAuthResult(result);
      }
    } catch (err) {
      lastError = err;
      console.error('Read-forsøg fejlede', err);
    }
  }

  if (!authHandled) {
    if (lastError) {
      authMsg.textContent = 'Fejl: ' + lastError.message;
    } else {
      authMsg.textContent = 'Fik altid: "' + lastRawValue + '" - ingen ændring';
    }
    authMsg.className = 'msg err';
  }
});

function handleAuthResult(result) {
  if (authHandled) return;
  authHandled = true;

  if (result === 'U') {
    authMsg.textContent = '';
    authCard.classList.add('hidden');
    configCard.classList.remove('hidden');
    loadAllParams();
  } else if (result === 'D') {
    authMsg.textContent = 'Forkert kode';
    authMsg.className = 'msg err';
  }
}

async function readByte(characteristic, label) {
  for (let i = 0; i < 6; i++) {
    try {
      const val = await Promise.race([
        characteristic.readValue(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1200))
      ]);
      if (val.byteLength >= 1) return val.getUint8(0);
    } catch (err) {
      console.error(label + ' read-forsøg ' + i + ' fejlede', err);
    }
    await new Promise(r => setTimeout(r, 150));
  }
  return null;
}

async function readCurrentValue() {
  const lo = await readByte(valueLoChar, 'lo');
  const hi = await readByte(valueHiChar, 'hi');
  if (lo === null || hi === null) return null;
  return lo + hi * 256;
}

async function loadAllParams() {
  loadMsg.textContent = 'Henter værdier...';
  loadMsg.className = 'msg';

  for (let i = 0; i < PARAMS.length; i++) {
    loadMsg.textContent = 'Henter værdier... (' + (i + 1) + '/' + PARAMS.length + ')';
    try {
      await selectChar.writeValue(new Uint8Array([i]));
    } catch (err) {
      console.error('Select fejlede for index ' + i, err);
      document.getElementById('val-' + i).textContent = 'fejl';
      continue;
    }
    await new Promise(r => setTimeout(r, 150));
    const val = await readCurrentValue();
    document.getElementById('val-' + i).textContent = (val !== null) ? val : 'fejl';
  }

  loadMsg.textContent = '';
}

async function adjustParam(idx, code) {
  const statusEl = document.getElementById('stat-' + idx);
  const valueEl = document.getElementById('val-' + idx);
  statusEl.textContent = '...';

  try {
    await adjustChar.writeValue(new Uint8Array([idx, code]));
  } catch (err) {
    statusEl.textContent = 'Fejl ved skrivning';
    console.error(err);
    return;
  }

  await new Promise(r => setTimeout(r, 150));
  const val = await readCurrentValue();

  if (val !== null) {
    valueEl.textContent = val;
    statusEl.textContent = '';
  } else {
    statusEl.textContent = 'Kunne ikke bekræfte - tjek værdien';
  }
}
</script>
</body>
</html>
